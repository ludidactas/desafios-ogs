  instruccion: "El salto diagonal en general no es una buena jugada. En chino se lo llama salto de
    elefante, por cómo se mueve el elefante en el ajedrez chino. Acá Negro juega un salto diagonal
    en 2 después de la 1 de Blanco. La gran desventaja del salto diagonal es que las piedras se
    pueden separar con facilidad: jugando en A, Blanco mantiene separadas las piedras negras. Jugás
    con blancas. Separá las piedras negras."
