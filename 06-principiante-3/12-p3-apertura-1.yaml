    - { r: 16, c: 4, tipo: letra, texto: "3" }
    - { r: 17, c: 3, tipo: letra, texto: "4" }
  secuencia:
    ramas:
      - en: [15, 2]
        correcto: true
        texto: "Bien. Blanco respondió: seguí."
        respuestaRival: [16, 4]
        siguiente:
          ramas:
