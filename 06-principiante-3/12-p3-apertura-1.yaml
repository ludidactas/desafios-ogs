- id: ogs-p3-apertura-1-01
  titulo: Apertura (1)
  etiqueta: p3-apertura-1
  dificultad: 4
  tamañoTablero: 19
  turno: B
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "Las primeras jugadas de la apertura se hacen en las esquinas. Los puntos indicados
    para jugar están marcados en este diagrama con las letras A a H. Lo más común es jugar en A, B,
    C o D; jugar en E, F, G o H lleva a josekis complejos. A es el punto 3-3: jugás ahí para
    quedarte con una esquina chica como territorio, y tu rival no lo puede impedir. B es el punto
    4-4: no conviene jugar en 4-4 para controlar la esquina, porque tu rival puede invadirla
    fácilmente jugando en el 3-3; jugás en 4-4 si querés desarrollar influencia hacia el centro. C y
    D son los puntos 3-4: jugar en 3-4 apunta a hacer territorio en la esquina, y después podés
    cerrarla con un shimari. Jugá en uno de los puntos marcados para continuar."
  marcas:
    - { r: 16, c: 2, tipo: letra, texto: A }
    - { r: 15, c: 3, tipo: letra, texto: B }
    - { r: 15, c: 2, tipo: letra, texto: C }
    - { r: 16, c: 3, tipo: letra, texto: D }
    - { r: 14, c: 2, tipo: letra, texto: E }
    - { r: 14, c: 3, tipo: letra, texto: F }
    - { r: 15, c: 4, tipo: letra, texto: G }
    - { r: 16, c: 4, tipo: letra, texto: H }
  desenlaces:
