      texto: ¡Correcto!
    - en: [15, 2]
      correcto: true
      texto: ¡Correcto!
    - en: [16, 3]
      correcto: true
      texto: ¡Correcto!
    - en: [14, 2]
      correcto: true
      texto: ¡Correcto!
    - en: [14, 3]
      correcto: true
      texto: ¡Correcto!
    - en: [15, 4]
      correcto: true
      texto: ¡Correcto!
    - en: [16, 4]
      correcto: true
      texto: ¡Correcto!

- id: ogs-p3-apertura-1-02
  titulo: Apertura (2)
  etiqueta: p3-apertura-1
  dificultad: 4
  tamañoTablero: 19
  turno: N
  tipo: secuencia
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: Con un shimari podés cerrar una esquina, y es difícil atacar una esquina cerrada así.
    Es una manera eficiente de hacer territorio, porque usás dos piedras en vez de un muro de cuatro
    o cinco para protegerlo. Más adelante podés agregar piedras para protegerlo mejor o ampliarlo.
    En este ejemplo Blanco ataca el shimari con 1 y 3, y Negro se defiende con 2 y 4. Jugás con
    negras. Defendete del ataque blanco.
  piedras:
    - { r: 14, c: 2, color: N }
    - { r: 15, c: 3, color: B }
    - { r: 16, c: 3, color: N }
  marcas:
    - { r: 15, c: 3, tipo: letra, texto: "1" }
