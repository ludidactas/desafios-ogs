- id: ogs-p3-apertura-2-01
  titulo: Apertura (1)
  etiqueta: p3-apertura-2
  dificultad: 4
  tamañoTablero: 19
  turno: N
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 9 }
  instruccion: "En la apertura tratás de marcar todo el territorio que puedas, sobre todo en las
    esquinas y los laterales, poniendo tus piedras como mojones en puntos bien elegidos. No conviene
    ponerlos demasiado separados, porque el rival podría meter una piedra en el medio; pero tampoco
    demasiado juntos. Hay reglas prácticas que ayudan, y una importante es la base: dos piedras
    separadas en la tercera línea, con dos intersecciones vacías entre ellas. Acá Negro puede hacer
    una base jugando en A, y Blanco no va a jugar entre esas dos piedras negras por un buen rato.
    Con una base, en general lográs hacer vivir el grupo. Jugás con negras. Hacé una base."
  piedras:
    - { r: 14, c: 2, color: B }
    - { r: 16, c: 3, color: B }
    - { r: 16, c: 5, color: N }
  marcas:
    - { r: 16, c: 8, tipo: letra, texto: A }
  desenlaces:
    - en: [16, 8]
      correcto: true
      texto: ¡Correcto!

