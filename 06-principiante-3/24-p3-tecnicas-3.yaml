  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 9 }
  instruccion: "A veces el rival hace una jugada y te preguntás si hace daño y si deberías responder.
    Si no hace daño, podés hacer una buena jugada en cualquier otro lado. A jugar en otro lado lo
    llamamos tenuki: no respondés a la jugada del rival con una defensa, sino que jugás en otra
    parte. Acá Blanco salta con la jugada 1 bien adentro del territorio negro, y amenaza conectar
    esa piedra con las otras blancas jugando en A. Si Negro quiere evitarlo, tiene que responder a
    la 1 blanca jugando en A. ¿Jugar en A es una buena respuesta a la 1 de Blanco, o conviene hacer
    tenuki?"
