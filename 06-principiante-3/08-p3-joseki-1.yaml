    principios detrás de ellos. Vamos a mostrar algunos josekis simples y explicar las ideas de cada
    jugada. Para empezar, miramos un joseki donde una piedra en el punto 4-4 es atacada (kakari,
    aproximación a la esquina) con un salto de caballo en 1, que es la aproximación habitual a una
    piedra en 4-4. Negro puede responder de distintas maneras; acá vemos una respuesta tranquila y
    defensiva: la 2 negra en la tercera línea. Blanco entra en la esquina con 3, Negro bloquea con 4
    y Blanco se arma una base con 5. Jugá este joseki con blancas."
