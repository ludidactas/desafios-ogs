    las tres es eficiente: las otras dos tienen una desventaja. Si Negro juega en A o en B, a las
    piedras blancas capturadas todavía les queda potencial (aji), y Blanco puede jugar más tarde en
    C y sacar algunos puntos en la esquina. Primero jugá en A o en B para ver qué pasa. Al final,
    hacé la jugada más eficiente."
