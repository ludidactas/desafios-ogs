- id: ogs-p1-seki-1-01
  titulo: Seki (1)
  etiqueta: p1-seki-1
  dificultad: 3
  tamañoTablero: 19
  turno: N
  tipo: opciones
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: >-
    Las dos cadenas marcadas tienen dos libertades. Si Blanco o Negro juega en A o en B, se pone a
    sí mismo en atari, así que ninguno de los dos va a jugar ahí. Esto se llama «seki». La posición
    queda como está: al terminar la partida, ninguno de los dos grupos está muerto, y los puntos
    vacíos del medio quedan vacíos y no cuentan como territorio para nadie.

    Si le toca a Blanco, ¿quién gana esta carrera de capturas, o es seki?
