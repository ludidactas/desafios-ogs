- id: ogs-p2-carrera-de-capturas-1-01
  titulo: Carrera de capturas (1)
  etiqueta: p2-carrera-de-capturas-1
  dificultad: 3
  tamañoTablero: 19
  turno: B
  tipo: secuencia
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "Al contar libertades, tené en cuenta que no siempre se pueden llenar directamente: si
    al llenar una libertad te ponés en atari, te capturan la piedra. Para evitarlo, primero tenés
    que hacer una jugada de aproximación o conectar tus piedras. En este ejemplo Blanco no puede
    jugar enseguida en C, porque quedaría en atari: primero tiene que aproximarse a C con una jugada
    en D, y eso le cuesta una jugada extra. Por eso necesita tres jugadas para capturar la cadena
    negra marcada: en la práctica, Negro tiene tres libertades. Del mismo modo, Negro no puede
    llenar enseguida la libertad B de la cadena blanca marcada: primero tiene que conectar sus
    piedras en A. Así que la cadena blanca marcada también tiene, en la práctica, tres libertades.
    Jugás con blancas. Hacé una jugada de aproximación y ganá la carrera de capturas."
