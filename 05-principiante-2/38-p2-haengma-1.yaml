  turno: B
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "En vez de un contacto, también te pueden atacar con un golpe de hombro: una jugada en
    diagonal pegada a tu piedra. Muchas veces la mejor defensa es estirar desde la piedra atacada.
    En este ejemplo Negro juega un golpe de hombro con la piedra 1, y Blanco tiene que defenderse
    estirando su piedra en A. Así, la piedra 1 de Negro queda apoyada contra una formación fuerte de
    dos piedras blancas. Jugás con blancas. Defendete bien de la jugada 1 de Negro."
  piedras:
    - { r: 14, c: 3, color: N }
    - { r: 15, c: 2, color: B }
    - { r: 16, c: 4, color: N }
  marcas:
    - { r: 14, c: 3, tipo: letra, texto: "1" }
    - { r: 14, c: 2, tipo: letra, texto: A }
  desenlaces:
    - en: [14, 2]
      correcto: true
      texto: ¡Correcto!
