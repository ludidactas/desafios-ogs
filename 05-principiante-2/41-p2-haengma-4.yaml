  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "Otro proverbio conocido dice: «Después de un corte cruzado, estirá». En general no
    conviene dar atari a una piedra de corte en un corte cruzado: muchas veces lo mejor es estirar
    desde una de las dos piedras cortadas. En este ejemplo Negro hace un corte cruzado con la jugada
    1, y Blanco tiene que estirar en A. Jugás con blancas. Estirá después de este corte cruzado."
