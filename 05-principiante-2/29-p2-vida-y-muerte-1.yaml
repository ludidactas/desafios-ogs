  tipo: secuencia
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "Si un grupo todavía no tiene dos ojos, tenés que asegurarte de que siempre los pueda
    hacer. Si necesitás una jugada para cada ojo, puede ser importante jugarlas en el orden
    correcto. En este ejemplo Blanco puede hacer dos ojos jugando en A y en B, pero tiene que elegir
    cuál juega primero: si elige mal, no va a tener chance de hacer el segundo. Hacé dos ojos en el
    orden correcto."
