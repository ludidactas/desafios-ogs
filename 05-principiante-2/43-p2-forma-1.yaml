  turno: N
  tipo: opciones
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "La forma es un concepto importante del Go: es cómo se disponen las piedras de un grupo
    en el tablero, y decide qué tan bien se pueden aprovechar en la partida. Hay buena forma y mala
    forma. Esta forma es un triángulo vacío, y es una mala forma: las tres piedras no rodean nada y
    una de ellas sobra. ¿El grupo negro tiene buena o mala forma?"
  piedras:
    - { r: 13, c: 3, color: N }
    - { r: 14, c: 3, color: N }
    - { r: 14, c: 4, color: N }
  opciones:
