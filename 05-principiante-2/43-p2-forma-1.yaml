  tipo: opciones
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "Esta forma es un amontonamiento, y es una mala forma: hay demasiadas piedras pegadas
    entre sí. Podrías sacar varias y el grupo seguiría siendo igual de fuerte o útil. Tenés piedras
    de más en el tablero, o sea que hiciste jugadas de más. ¿El grupo negro tiene buena o mala
