# Fuente: github.com/online-go/online-go.com
# Cambios respecto del original: adaptación al formato Desafio, coordenadas a [fila, columna],
# textos en castellano rioplatense y feedback propio por rama.

# Coordenadas: [fila, columna] desde la esquina superior izquierda.

- id: fundamentos-autocaptura-1
  titulo: "Autocaptura (1)"
  etiqueta: autocaptura
  dificultad: 2
  tamañoTablero: 9
  turno: B
  instruccion: >
    Jugás con blancas: capturá las piedras negras marcadas con un triángulo.
  piedras:
    - { r: 0, c: 7, color: N }
    - { r: 1, c: 6, color: N }
    - { r: 1, c: 8, color: N }
    - { r: 2, c: 7, color: N }
    - { r: 3, c: 4, color: B }
    - { r: 4, c: 2, color: N }
    - { r: 4, c: 3, color: B }
    - { r: 4, c: 4, color: N }
    - { r: 4, c: 5, color: B }
    - { r: 5, c: 3, color: N }
    - { r: 5, c: 5, color: N }
    - { r: 5, c: 6, color: B }
    - { r: 6, c: 4, color: N }
    - { r: 6, c: 5, color: B }
    - { r: 7, c: 4, color: N }
  marcas:
    - { r: 0, c: 8, tipo: letra, texto: "A" }
    - { r: 1, c: 7, tipo: letra, texto: "B" }
    - { r: 5, c: 4, tipo: letra, texto: "C" }
    - { r: 4, c: 4, tipo: triangulo }
    - { r: 5, c: 5, tipo: triangulo }
  jugadasCorrectas:
    - [5, 4]
  mensajeError: >
    Esa jugada no captura las piedras marcadas. Recordá que una jugada sin
    libertades solo vale si captura algo.
  explicacion: >
    Jugar en A o en B se llama autocaptura (la piedra blanca se quedaría sin
    libertades) y no está permitido. En C sí se puede, porque captura las
    piedras marcadas y así deja libertades a Blanco.

- id: fundamentos-autocaptura-2
  titulo: "Autocaptura (2)"
  etiqueta: autocaptura
  dificultad: 2
  tamañoTablero: 9
  turno: B
  instruccion: "Jugás con blancas: capturá una o más piedras negras."
  piedras:
    - { r: 4, c: 4, color: B }
    - { r: 4, c: 5, color: B }
    - { r: 5, c: 2, color: B }
    - { r: 5, c: 3, color: B }
    - { r: 5, c: 4, color: N }
    - { r: 5, c: 5, color: N }
    - { r: 5, c: 6, color: B }
    - { r: 6, c: 2, color: N }
    - { r: 6, c: 3, color: N }
    - { r: 6, c: 4, color: B }
    - { r: 6, c: 6, color: N }
    - { r: 7, c: 4, color: N }
    - { r: 7, c: 5, color: N }
  jugadasCorrectas:
    - [6, 5]
  mensajeError: "Esa jugada no captura ninguna piedra negra."
  explicacion: >
    Los dos bandos están en atari. Poner una piedra donde no te quedan
    libertades no está permitido, salvo que con esa jugada captures piedras:
    al capturar se liberan puntos y tu piedra queda con libertades.

