  piedrasMuertas:
    - [0, 5]
  mensajeExito: "¡Bien! Esas piedras negras estaban muertas y se retiran del tablero."
  mensajeError: >
    Esa piedra está viva. Buscá las piedras negras que quedaron sin salida
    dentro del territorio de Blanco.
  explicacion: >
    Después de que los dos jugadores pasan empieza la fase de retiro: se sacan
    del tablero las piedras que evidentemente están muertas, es decir, las que
    ya no pueden salvarse.

