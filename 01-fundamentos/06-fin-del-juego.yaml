  mensajeExito: "¡Los dos pasaron! La partida terminó."
  explicacion: >
    No estás obligado a poner una piedra en tu turno: podés pasar. Cuando
    ninguno de los dos cree que queden buenas jugadas, los dos pasan y la
    partida termina. Esta partida ya está terminada.

- id: fundamentos-retirar-muertas
