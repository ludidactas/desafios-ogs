    - { r: 6, c: 0, color: N }
    - { r: 6, c: 2, color: N }
    - { r: 6, c: 4, color: N }
    - { r: 6, c: 5, color: N }
    - { r: 6, c: 6, color: N }
  opciones:
    - { texto: "Terminar", correcta: true }
  mensajeExito: "¡Partida terminada! Negro ganó con 24 puntos contra 22."
  explicacion: >
    Después de retirar las piedras muertas se cuenta el territorio de cada
    jugador. El territorio de Negro es de 24 puntos. Blanco tiene 18 puntos de
    territorio, y a eso se le suman las 4 piedras muertas capturadas: en total
    22 puntos. Gana Negro.
