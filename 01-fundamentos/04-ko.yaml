# Cambios respecto del original: adaptación al formato Desafio, coordenadas a [fila, columna],
# textos en castellano rioplatense y feedback propio por rama.

# Coordenadas: [fila, columna] desde la esquina superior izquierda.

- id: fundamentos-regla-del-ko
  titulo: "La regla del ko"
  etiqueta: ko
  dificultad: 2
  tamañoTablero: 9
  turno: N
  instruccion: "Capturá la piedra marcada."
  piedras:
    - { r: 1, c: 3, color: B }
    - { r: 1, c: 4, color: N }
    - { r: 2, c: 2, color: B }
    - { r: 2, c: 4, color: B }
    - { r: 2, c: 5, color: N }
    - { r: 3, c: 3, color: B }
    - { r: 3, c: 4, color: N }
  marcas:
    - { r: 2, c: 4, tipo: triangulo }
  jugadasCorrectas:
    - [2, 3]
  mensajeError: "Esa jugada no captura la piedra marcada."
  explicacion: >
    Para evitar que se recapture una y otra vez en el mismo lugar existe la
    regla del ko: no se puede recapturar de inmediato y dejar el tablero igual
    que antes. Negro puede capturar la piedra marcada; Blanco no puede
    recapturar enseguida y tiene que jugar primero en otro lado.

- id: fundamentos-ko-capturar-un-grupo
  titulo: "Ko: capturar un grupo"
  etiqueta: ko
  dificultad: 3
  tamañoTablero: 9
  turno: N
  tipo: secuencia
  instruccion: >
    Jugás con negras: capturá el grupo blanco aprovechando la regla del ko.
  piedras:
    - { r: 5, c: 0, color: N }
    - { r: 5, c: 1, color: N }
    - { r: 5, c: 2, color: N }
    - { r: 6, c: 0, color: B }
    - { r: 6, c: 1, color: B }
    - { r: 6, c: 2, color: N }
    - { r: 7, c: 0, color: B }
    - { r: 7, c: 2, color: B }
    - { r: 7, c: 3, color: N }
    - { r: 8, c: 1, color: B }
    - { r: 8, c: 2, color: N }
    - { r: 8, c: 3, color: N }
  secuencia:
    ramas:
      - en: [7, 1]
        correcto: true
        texto: >
          Capturaste una piedra y quedó un ko: Blanco no puede recapturar de
          inmediato y juega en otro lado. Ahora ocupá la última libertad del
          grupo blanco.
        respuestaRival: [6, 3]
        siguiente:
          ramas:
            - en: [8, 0]
              correcto: true
              texto: >
                ¡Correcto! Blanco no pudo recapturar por el ko y su grupo
                quedó capturado.
  explicacion: >
    Negro captura una piedra y forma un ko: Blanco no puede recapturar de
    inmediato y tiene que jugar en otro lado. Con ese tiempo, Negro ocupa la
    última libertad del grupo blanco y lo captura.
  mensajeError: "Con esa jugada el grupo blanco no queda capturado."

- id: fundamentos-ko-conectar
  titulo: "Ko: conectar tus piedras"
  etiqueta: ko
  dificultad: 3
  tamañoTablero: 9
  turno: N
  tipo: secuencia
  instruccion: "Jugás con negras: conectá tus piedras."
  piedras:
    - { r: 2, c: 4, color: N }
    - { r: 3, c: 4, color: N }
    - { r: 3, c: 5, color: B }
    - { r: 4, c: 2, color: B }
    - { r: 4, c: 3, color: B }
    - { r: 4, c: 4, color: N }
    - { r: 4, c: 5, color: B }
    - { r: 5, c: 3, color: N }
    - { r: 5, c: 4, color: B }
    - { r: 5, c: 6, color: B }
    - { r: 6, c: 2, color: B }
    - { r: 6, c: 3, color: B }
    - { r: 6, c: 4, color: N }
    - { r: 6, c: 5, color: B }
    - { r: 7, c: 4, color: N }
    - { r: 7, c: 5, color: N }
  secuencia:
    ramas:
      - en: [5, 5]
        correcto: true
        texto: >
          Capturaste la piedra blanca y, por la regla del ko, Blanco no puede
          recapturar enseguida. Aprovechá para conectar.
        respuestaRival: [5, 2]
        siguiente:
          ramas:
            - en: [5, 4]
              correcto: true
              texto: >
                ¡Correcto! Conectaste antes de que Blanco pudiera recapturar:
                tus piedras quedaron unidas.
      - en: [5, 2]
        correcto: false
        texto: >
          Con esa jugada tus piedras negras siguen separadas por la piedra
          blanca.
        respuestaRival: [5, 1]
      - en: [6, 6]
        correcto: false
        texto: >
          Con esa jugada tus piedras negras siguen separadas por la piedra
          blanca.
        respuestaRival: [5, 2]
  explicacion: >
    La piedra blanca del medio separa a las negras y está en atari. Al
    capturarla se forma un ko: Blanco no puede recapturar de inmediato, y
    Negro aprovecha ese turno para conectar.
  mensajeError: >
    Con esa jugada tus piedras negras siguen separadas por la piedra blanca.

- id: fundamentos-ko-capturar-dos
  titulo: "Ko: capturar dos piedras"
  etiqueta: ko
  dificultad: 3
  tamañoTablero: 9
  turno: N
  tipo: secuencia
  instruccion: >
    Jugás con negras: capturá dos piedras blancas aprovechando la regla del
    ko.
  piedras:
    - { r: 2, c: 5, color: N }
    - { r: 3, c: 4, color: B }
    - { r: 3, c: 5, color: N }
    - { r: 4, c: 5, color: B }
    - { r: 4, c: 6, color: N }
    - { r: 5, c: 4, color: B }
    - { r: 5, c: 6, color: B }
    - { r: 5, c: 7, color: N }
    - { r: 6, c: 5, color: B }
    - { r: 6, c: 6, color: N }
    - { r: 7, c: 4, color: B }
    - { r: 7, c: 5, color: N }
    - { r: 7, c: 6, color: N }
  secuencia:
    ramas:
      - en: [5, 5]
        correcto: true
        texto: >
          Capturaste una piedra y quedó un ko: Blanco no puede recapturar
          enseguida. Ahora capturá la segunda piedra.
        respuestaRival: [6, 4]
        siguiente:
          ramas:
            - en: [4, 4]
              correcto: true
              texto: "¡Correcto! Capturaste las dos piedras blancas."
      - en: [6, 4]
        correcto: false
        texto: "Esa jugada no funciona acá: Blanco se salva."
        respuestaRival: [6, 3]
      - en: [4, 4]
        correcto: false
        texto: "Esa jugada no funciona acá: Blanco se salva."
        respuestaRival: [4, 3]
      - en: [4, 7]
        correcto: false
        texto: "Esa jugada no funciona acá: Blanco se salva."
        respuestaRival: [5, 5]
      - en: [3, 6]
        correcto: false
        texto: "Esa jugada no funciona acá: Blanco se salva."
        respuestaRival: [5, 5]
  explicacion: >
    Negro captura una piedra y forma un ko: Blanco no puede recapturar de
    inmediato, y Negro aprovecha ese turno para capturar la segunda piedra.
  mensajeError: "Esa jugada no funciona acá: Blanco se salva."

- id: fundamentos-amenaza-de-ko
  titulo: "Amenaza de ko"
  etiqueta: ko
  dificultad: 4
  tamañoTablero: 13
  turno: N
  tipo: secuencia
  instruccion: >
    Jugás con negras: buscá una amenaza de ko y después capturá el grupo
    marcado.
  piedras:
    - { r: 4, c: 1, color: B }
    - { r: 5, c: 1, color: B }
    - { r: 6, c: 0, color: B }
    - { r: 6, c: 1, color: N }
    - { r: 6, c: 2, color: N }
    - { r: 7, c: 1, color: B }
    - { r: 7, c: 2, color: N }
    - { r: 8, c: 0, color: B }
    - { r: 8, c: 1, color: B }
    - { r: 8, c: 2, color: N }
    - { r: 9, c: 1, color: B }
    - { r: 9, c: 2, color: N }
    - { r: 10, c: 0, color: B }
    - { r: 10, c: 1, color: N }
    - { r: 11, c: 0, color: N }
    - { r: 11, c: 2, color: N }
    - { r: 12, c: 1, color: N }
  marcas:
    - { r: 10, c: 0, tipo: letra, texto: "1" }
    - { r: 8, c: 0, tipo: triangulo }
    - { r: 9, c: 1, tipo: triangulo }
    - { r: 8, c: 1, tipo: triangulo }
    - { r: 7, c: 1, tipo: triangulo }
  secuencia:
    ramas:
      - en: [5, 0]
        correcto: true
        texto: "Esa jugada es una amenaza de ko: Blanco responde capturándola."
        respuestaRival: [4, 0]
        siguiente:
          ramas:
            - en: [9, 0]
              correcto: true
              texto: >
                Blanco tuvo que responder a tu amenaza, así que ahora podés
                recapturar el ko. Blanco juega en otro lado.
              respuestaRival: [7, 0]
              siguiente:
                ramas:
                  - en: [5, 0]
                    correcto: true
                    texto: >
                      ¡Correcto! Con la amenaza de ko lograste recapturar y
                      capturar el grupo.
      - en: [9, 0]
        correcto: false
        texto: >
          Todavía no podés recapturar: la regla del ko lo prohíbe. Primero
          hace falta una amenaza de ko.
      - en: [4, 0]
        correcto: false
        texto: "Esa jugada no es una amenaza que Blanco tenga que responder."
        respuestaRival: [5, 0]
      - en: [10, 2]
        correcto: false
        texto: "Esa jugada no es una amenaza que Blanco tenga que responder."
        respuestaRival: [5, 0]
      - en: [11, 1]
        correcto: false
        texto: "Esa jugada no es una amenaza que Blanco tenga que responder."
        respuestaRival: [5, 0]
      - en: [12, 2]
        correcto: false
        texto: "Esa jugada no es una amenaza que Blanco tenga que responder."
        respuestaRival: [5, 0]
      - en: [12, 0]
        correcto: false
        texto: "Esa jugada no es una amenaza que Blanco tenga que responder."
        respuestaRival: [5, 0]
      - en: [5, 2]
        correcto: false
        texto: "Esa jugada no es una amenaza que Blanco tenga que responder."
        respuestaRival: [5, 0]
  explicacion: >
    Blanco acaba de capturar una piedra negra jugando en el punto 1. Para
    superar la regla del ko, Negro necesita una jugada en otro lugar que
    obligue a Blanco a responder: eso se llama amenaza de ko. Después de que
    Blanco responde, Negro ya puede recapturar y capturar el grupo blanco
    marcado.
  mensajeError: "Esa jugada no es una amenaza que Blanco tenga que responder."
