# Fundamentos › Ko — La regla del ko, cómo recapturar y amenazas de ko

# Escrito a mano (no lo genera extraer-ogs.mjs) a partir de la sección "Fundamentals" del tutorial
# "Learn to Play Go" de online-go.com (https://online-go.com/learn-to-play-go/).
