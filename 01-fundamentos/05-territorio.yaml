- id: fundamentos-territorio-muertas-1
  titulo: "Piedras muertas y territorio (1)"
  etiqueta: territorio
  dificultad: 3
  tamañoTablero: 9
  turno: N
  tipo: opciones
  instruccion: >
    ¿Cuántos puntos de territorio tiene Negro en la zona cerrada de abajo del
    tablero?
  piedras:
    - { r: 4, c: 4, color: B }
    - { r: 4, c: 6, color: B }
    - { r: 4, c: 7, color: B }
    - { r: 4, c: 8, color: B }
    - { r: 5, c: 5, color: B }
    - { r: 5, c: 6, color: N }
    - { r: 5, c: 7, color: N }
    - { r: 5, c: 8, color: N }
    - { r: 6, c: 4, color: B }
    - { r: 6, c: 5, color: N }
    - { r: 6, c: 6, color: N }
    - { r: 6, c: 7, color: B }
    - { r: 7, c: 4, color: B }
    - { r: 7, c: 5, color: N }
    - { r: 7, c: 7, color: N }
    - { r: 8, c: 4, color: B }
    - { r: 8, c: 5, color: N }
  opciones:
    - { texto: "6", correcta: false }
    - { texto: "7", correcta: false }
    - { texto: "8", correcta: true }
  mensajeExito: "¡Correcto! Son 8 puntos."
  mensajeError: >
    No es esa cantidad. Recordá que cada piedra muerta vale dos puntos:
    prisionera y territorio.
  explicacion: >
    Las piedras del rival dentro de tu territorio se pierden si no tienen dos
    ojos: se llaman piedras muertas. Al final de la partida se sacan del
    tablero como prisioneras y dejan vacío su punto de territorio. Por eso una
    piedra muerta vale dos puntos: uno como prisionera y otro como territorio.

