- id: fundamentos-territorio-que-es
  titulo: "Qué es el territorio"
  etiqueta: territorio
  dificultad: 1
  tamañoTablero: 9
  turno: N
  tipo: opciones
  instruccion: >
    ¿Cuántos puntos de territorio tiene Negro en la zona cerrada de abajo del
    tablero?
  piedras:
    - { r: 5, c: 6, color: B }
    - { r: 5, c: 7, color: B }
    - { r: 5, c: 8, color: B }
    - { r: 6, c: 4, color: B }
    - { r: 6, c: 5, color: B }
    - { r: 6, c: 6, color: N }
    - { r: 6, c: 7, color: N }
    - { r: 6, c: 8, color: N }
    - { r: 7, c: 4, color: B }
    - { r: 7, c: 5, color: N }
    - { r: 7, c: 7, color: N }
    - { r: 8, c: 4, color: B }
    - { r: 8, c: 5, color: N }
    - { r: 8, c: 6, color: N }
  opciones:
    - { texto: "3", correcta: false }
    - { texto: "4", correcta: true }
    - { texto: "5", correcta: false }
  mensajeExito: "¡Correcto! Son 4 puntos."
  mensajeError: >
    No es esa cantidad. Contá de nuevo los puntos vacíos que están dentro de
    la zona cerrada.
  explicacion: >
    Si rodeás una parte del tablero con tus piedras, esa parte es tu
    territorio. Cada punto vacío de tu territorio cuenta como un punto. Los
    puntos se consiguen con territorio y con capturas, y al final de la
    partida gana quien tiene más.

