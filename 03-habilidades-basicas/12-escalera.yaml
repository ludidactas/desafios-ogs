    - { r: 4, c: 6, color: B }
    - { r: 4, c: 7, color: N }
    - { r: 5, c: 5, color: N }
    - { r: 5, c: 6, color: B }
    - { r: 5, c: 7, color: B }
    - { r: 6, c: 6, color: N }
  marcas:
    - { r: 5, c: 7, tipo: triangulo }
    - { r: 5, c: 6, tipo: triangulo }
    - { r: 4, c: 6, tipo: triangulo }
    - { r: 4, c: 5, tipo: triangulo }
    - { r: 3, c: 5, tipo: triangulo }
    - { r: 3, c: 4, tipo: triangulo }
  secuencia:
    ramas:
      - en: [5, 8]
        correcto: true
        texto: "Bien. Blanco respondió: seguí."
        respuestaRival: [6, 7]
        siguiente:
          ramas:
            - en: [7, 7]
              correcto: true
              texto: ¡Correcto!
            - en: [6, 8]
              correcto: false
              texto: "Esa jugada no funciona: Blanco tiene una buena respuesta."
              respuestaRival: [7, 7]
      - en: [6, 7]
        correcto: true
        texto: ¡Correcto!

