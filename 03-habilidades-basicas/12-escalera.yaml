- id: ogs-escalera-01
  titulo: Escalera (1)
  etiqueta: escalera
  dificultad: 2
  tamañoTablero: 9
  turno: N
  tipo: secuencia
  instruccion: "Jugás con negras: la cadena marcada tiene solo dos libertades. Jugando una y otra vez
    en la cabeza de la cadena blanca, Negro puede capturar las piedras marcadas: eso se llama
    «escalera». Negro tiene que impedir que Blanco llegue a tres libertades. Capturá las piedras
    marcadas en escalera."
  piedras:
    - { r: 2, c: 4, color: N }
    - { r: 2, c: 5, color: N }
    - { r: 3, c: 3, color: N }
    - { r: 3, c: 4, color: B }
