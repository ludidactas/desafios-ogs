    - { r: 6, c: 3, color: N }
    - { r: 6, c: 6, color: B }
    - { r: 7, c: 4, color: N }
    - { r: 7, c: 5, color: B }
    - { r: 7, c: 7, color: B }
  marcas:
    - { r: 5, c: 4, tipo: triangulo }
    - { r: 5, c: 5, tipo: triangulo }
    - { r: 6, c: 4, tipo: letra, texto: A }
    - { r: 6, c: 5, tipo: letra, texto: B }
  secuencia:
