  titulo: Contracaptura (1)
  etiqueta: tirar-y-recapturar
  dificultad: 2
  tamañoTablero: 9
  turno: N
  tipo: secuencia
  instruccion: Negro puede capturar las dos piedras blancas marcadas. No le conviene dar atari en A,
    porque Blanco se defendería jugando en B. Primero tiene que ponerse él mismo en atari jugando en
    B. Blanco puede capturar esa piedra jugando en A, pero entonces sus tres piedras quedan en
    atari. Capturar así se llama «contracaptura» (snapback). Capturá las piedras blancas marcadas.
