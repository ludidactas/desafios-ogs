    - { r: 16, c: 9, tipo: letra, texto: B }
    - { r: 16, c: 11, tipo: letra, texto: C }
  secuencia:
    ramas:
      - en: [16, 9]
        correcto: true
        texto: "Bien. Blanco respondió: seguí."
        respuestaRival: [16, 7]
