- id: ogs-p4-apertura-1-01
  titulo: Apertura (1)
  etiqueta: p4-apertura-1
  dificultad: 5
  tamañoTablero: 19
  turno: N
  tipo: secuencia
  recorte: { arriba: 9, abajo: 18, izquierda: 0, derecha: 18 }
  instruccion: "Una vez ocupadas las esquinas, podés jugar en los laterales. Jugá en un lateral que
    tenga espacio suficiente para hacer una base, y elegí el que tenga más espacio. Mejor si es un
    lateral entre dos esquinas ocupadas por tu rival: jugando ahí, dividís sus piedras. Dividí
    jugando en la tercera línea. Si ponés una piedra en un lateral, el rival la puede atacar desde
    uno de los dos lados; en ese caso, vas a querer defenderte haciendo una base del otro lado. Para
    eso, asegurate de que tu primera piedra se pueda extender hacia los dos lados: cuando el rival
    te ataque de un lado, te extendés hacia el otro. Jugás con negras. Elegí la mejor jugada para
    dividir: A, B o C."
  piedras:
    - { r: 14, c: 2, color: B }
    - { r: 15, c: 16, color: B }
    - { r: 16, c: 3, color: B }
    - { r: 16, c: 14, color: B }
  marcas:
