- id: ogs-p4-apertura-2-01
  titulo: Apertura (1)
  etiqueta: p4-apertura-2
  dificultad: 5
  tamañoTablero: 19
  turno: N
  recorte: { arriba: 9, abajo: 18, izquierda: 0, derecha: 18 }
  instruccion: "Frente a una piedra que divide, podés decidir atacarla. Atacá del lado hacia donde el
    rival se puede extender más fácil. Si tenés una piedra en la tercera línea de un lado de la
    piedra que divide y otra en la cuarta línea del otro lado, atacá desde la de la cuarta línea:
    así defendés el lado abierto. Si tenés un grupo fuerte de un lado (por ejemplo, porque cerraste
    esa esquina) y la otra esquina es más débil, jugá desde la esquina débil: así fortalecés tu
    grupo débil. Jugás con negras. Elegí el mejor lado para atacar: A o B."
  piedras:
    - { r: 15, c: 3, color: N }
    - { r: 15, c: 16, color: N }
    - { r: 16, c: 9, color: B }
    - { r: 16, c: 14, color: N }
  marcas:
    - { r: 16, c: 7, tipo: letra, texto: A }
    - { r: 16, c: 11, tipo: letra, texto: B }
  desenlaces:
    - en: [16, 7]
      correcto: true
      texto: ¡Correcto!
    - en: [16, 11]
      correcto: false
      texto: Esa jugada no resuelve el problema.

