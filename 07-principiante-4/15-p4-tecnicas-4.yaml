- id: ogs-p4-tecnicas-4-01
  titulo: Habilidades (1)
  etiqueta: p4-tecnicas-4
  dificultad: 5
  tamañoTablero: 19
  turno: N
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 8 }
  instruccion: "Cuando el rival te da atari, muchas veces estás obligado a responder, y eso le da una
    buena oportunidad para reforzar su posición o dejarte con mala forma. En este ejemplo Blanco
    puede dar atari a una piedra jugando en A: si después la protegés, vas a quedar con mala forma y
    Blanco se queda con la esquina. Te conviene jugar vos en A para evitar el atari. Jugar en B es
    pasarse: Blanco igual puede dar atari y después capturar tu piedra en B. Jugás con negras. Evitá
    el atari. Elegí la mejor jugada: A o B."
  piedras:
    - { r: 11, c: 2, color: B }
    - { r: 13, c: 2, color: B }
    - { r: 14, c: 2, color: B }
    - { r: 14, c: 3, color: N }
    - { r: 15, c: 1, color: B }
    - { r: 15, c: 2, color: N }
    - { r: 15, c: 4, color: N }
  marcas:
    - { r: 16, c: 2, tipo: letra, texto: A }
    - { r: 16, c: 1, tipo: letra, texto: B }
  desenlaces:
    - en: [16, 2]
      correcto: true
      texto: ¡Correcto!

