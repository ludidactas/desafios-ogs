- id: ogs-p4-tecnicas-1-01
  titulo: Habilidades (1)
  etiqueta: p4-tecnicas-1
  dificultad: 5
  tamañoTablero: 19
  turno: B
  recorte: { arriba: 10, abajo: 18, izquierda: 0, derecha: 10 }
  instruccion: "Para mantener débil un grupo rival, una buena táctica es rodearlo o cortarlo, y muchas
    veces se rodea bloqueando el avance de las piedras rivales. En este ejemplo las piedras negras
    pueden avanzar en distintas direcciones: hacia A, Negro se puede desarrollar hacia el centro;
    hacia B, corre hacia el borde, un callejón sin salida; hacia C, se puede desarrollar por el
    borde, pero de ese lado ya hay una piedra blanca. Si Blanco quiere frenar el desarrollo de
    Negro, lo mejor es jugar en A, bloqueando el avance hacia el centro. Jugás con blancas. Elegí la
    mejor forma de bloquear: A, B o C."
  piedras:
    - { r: 15, c: 2, color: B }
    - { r: 15, c: 3, color: N }
    - { r: 15, c: 5, color: B }
    - { r: 16, c: 2, color: B }
    - { r: 16, c: 3, color: N }
  marcas:
    - { r: 14, c: 3, tipo: letra, texto: A }
    - { r: 17, c: 3, tipo: letra, texto: B }
    - { r: 17, c: 5, tipo: letra, texto: C }
  desenlaces:
